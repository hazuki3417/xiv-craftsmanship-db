services:
  xiv-craftsmanship-db:
    build:
      context: .
      dockerfile: ./docker/develop/xiv-craftsmanship-db/Dockerfile
    image: xiv-craftsmanship-db
    hostname: xiv-craftsmanship-db
    container_name: xiv-craftsmanship-db
    restart: always
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: example
    networks:
      - xiv-craftsmanship-db-network
    ports:
      - "5432:5432"

  build:
    image: node:20-slim
    profiles: ["manual"]
    working_dir: /app
    volumes:
      - ./app:/app
    command: ["npm", "run", "build:ci"]

  # NOTE: コマンド実行例
  #       docker compose run scraping /app/dist/example/sample.js
  # NOTE: docker imageのバージョンを固定
  #       バージョンが変わるとブラウザのバージョンも代わりexecutablePathもかわるので注意
  scraping:
    image: ghcr.io/puppeteer/puppeteer:24.33.0
    profiles: ["manual"]
    networks:
      - xiv-craftsmanship-db-network
    init: true
    tty: false
    user: "1000:1000"
    volumes:
    - ./app:/app
    working_dir: /app
    command: ["node"]


networks:
  xiv-craftsmanship-db-network:
    name: xiv-craftsmanship-db-network
