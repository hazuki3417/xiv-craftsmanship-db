services:
  xiv-craftsmanship-db:
    image: ghcr.io/hazuki3417/xiv-craftsmanship-db:latest
    hostname: xiv-craftsmanship-db
    container_name: xiv-craftsmanship-db
    restart: always
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: example
    networks:
      - xiv-craftsmanship-db-network
    ports:
      - "5432:5432"

  # NOTE: コマンド実行例
  #       docker compose run scraping /app/dist/example/sample.js
  scraping:
    image: ghcr.io/hazuki3417/xiv-craftsmanship-scraping:latest
    profiles: ["manual"]
    networks:
      - xiv-craftsmanship-db-network
    init: true
    tty: false
    user: root
    volumes:
      - ./app/datastore:/app/datastore


networks:
  xiv-craftsmanship-db-network:
    name: xiv-craftsmanship-db-network
