services:
  xiv-craftsmanship-db:
    build:
      context: .
      dockerfile: ./docker/develop/xiv-craftsmanship-db/Dockerfile
    image: xiv-craftsmanship-db
    hostname: xiv-craftsmanship-db
    container_name: xiv-craftsmanship-db
    restart: always
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
      POSTGRES_DB: example
    ports:
      - "5432:5432"

  scraping:
    image: ghcr.io/puppeteer/puppeteer:latest
    init: true
    tty: false
    user: "1000:1000"
    volumes:
    - ./app:/app
    working_dir: /app
    command: ["node", "/app/dist/items/1.weapons.js"]
