name: Build and Deploy to GHCR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/**
      - app/src/**
      - data/**

env:
  REGISTRY: ghcr.io

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      scraping: ${{ steps.filter.outputs.scraping }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            db:
              - docker/develop/xiv-craftsmanship-db/**
              - data/**
            scraping:
              - docker/develop/xiv-craftsmanship-scraping/**
              - app/src/**

  deploy:
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - name: xiv-craftsmanship-db
            dockerfile: docker/develop/xiv-craftsmanship-db/Dockerfile
            enabled: ${{ needs.check.outputs.db }}
          - name: xiv-craftsmanship-scraping
            dockerfile: docker/develop/xiv-craftsmanship-scraping/Dockerfile
            enabled: ${{ needs.check.outputs.scraping }}

    if: matrix.image.enabled == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
