name: scraping items

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  # ※ dump → commit を行うため、通常は workflow_dispatch 推奨

env:
  REGISTRY: ghcr.io

jobs:
  scraping:
    name: scraping (${{ matrix.name }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: weapons
            script: /app/dist/scraping/items/1.weapons.js
            output: app/datastore/items/1.weapons.ndjson

          - name: tools
            script: /app/dist/scraping/items/2.tools.js
            output: app/datastore/items/2.tools.ndjson

          - name: armors
            script: /app/dist/scraping/items/3.armors.js
            output: app/datastore/items/3.armors.ndjson

          - name: accessorys
            script: /app/dist/scraping/items/4.accessorys.js
            output: app/datastore/items/4.accessorys.ndjson

          - name: medicines
            script: /app/dist/scraping/items/5.medicines.js
            output: app/datastore/items/5.medicines.ndjson

          - name: materials
            script: /app/dist/scraping/items/6.materials.js
            output: app/datastore/items/6.materials.ndjson

          - name: other
            script: /app/dist/scraping/items/7.other.js
            output: app/datastore/items/7.other.ndjson

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run scraping script
        run: |
          docker compose run --rm scraping ${{ matrix.script }} > ${{ matrix.output }}


      - name: Upload scraping artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraping-${{ matrix.name }}
          path: ${{ matrix.output }}
          retention-days: 1

  create:
    name: import items and dump
    runs-on: ubuntu-latest
    needs: scraping

    permissions:
      contents: write   # dump 後の commit 用
      packages: read

    steps:
      - uses: actions/checkout@v4

      # NOTE: Scraping artifact 一括取得
      - name: Download scraping artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place artifacts into app/datastore/items
        run: |
          mkdir -p app/datastore/items

          find artifacts -name "*.json" -type f -exec cp {} app/datastore/items/ \;

          echo "Placed files:"
          ls -al app/datastore/items

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Postgres
        run: |
          docker compose up -d xiv-craftsmanship-db

      - name: Wait for Postgres
        run: |
          until docker compose exec -T xiv-craftsmanship-db pg_isready; do
            sleep 1
          done

      - name: Insert items (serial)
        run: |
          set -e

          for script in \
            1.weapons.ndjson \
            2.tools.ndjson \
            3.armors.ndjson \
            4.accessorys.ndjson \
            5.medicines.ndjson \
            6.materials.ndjson \
            7.other.ndjson
          do
            echo "execute $script"

            docker compose run --rm scraping "/app/dist/batch/items/main.js" "/app/datastore/items/${script}"
          done

      # --------------------------------------------------------
      # items テーブルをダンプ
      # --------------------------------------------------------
      - name: Dump items table
        run: |
          mkdir -p data/initialize/seeder

          docker compose exec -T xiv-craftsmanship-db \
            pg_dump \
              -U example \
              -d example \
              --data-only \
              --table=items \
              --column-inserts \
              --inserts \
          > data/initialize/seeder/items.sql

      - name: Commit and push dump
        run: |
          set -e

          if git diff --quiet data/initialize/seeder/items.sql; then
            echo "No changes in items.sql"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/initialize/seeder/items.sql
          git commit -m "chore(db): update items seeder"
          git push
