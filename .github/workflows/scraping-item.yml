name: scraping items

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: xiv-craftsmanship-scraping
  IMAGE: ghcr.io/${{ github.repository_owner }}/xiv-craftsmanship-scraping:latest

jobs:
  scraping:
    name: scraping (${{ matrix.name }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read   # GHCR pull 用

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: weapons
            script: /app/dist/scraping/items/1.weapons.js
            output: app/datastore/items/1.weapons.json

          - name: tools
            script: /app/dist/scraping/items/2.tools.js
            output: app/datastore/items/2.tools.json

          - name: armors
            script: /app/dist/scraping/items/3.armors.js
            output: app/datastore/items/3.armors.json

          - name: accessorys
            script: /app/dist/scraping/items/4.accessorys.js
            output: app/datastore/items/4.accessorys.json

          - name: medicines
            script: /app/dist/scraping/items/5.medicines.js
            output: app/datastore/items/5.medicines.json

          - name: materials
            script: /app/dist/scraping/items/6.materials.js
            output: app/datastore/items/6.materials.json

          - name: other
            script: /app/dist/scraping/items/7.other.js
            output: app/datastore/items/7.other.json

    steps:
      # --------------------------------------------------------
      # 1. GHCR へログイン（pull 用）
      # --------------------------------------------------------
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # 2. scraping 用イメージを取得
      # --------------------------------------------------------
      - name: Pull scraping image
        run: |
          docker pull ${{ env.IMAGE }}

      # --------------------------------------------------------
      # 3. puppeteer コンテナを実行（成果物は workspace へ）
      # --------------------------------------------------------
      - name: Run scraping script in container
        run: |
          mkdir -p app/datastore/items

          docker run --rm \
            -v "${{ github.workspace }}/app/datastore:/app/datastore" \
            ${{ env.IMAGE }} \
            node ${{ matrix.script }}

      # --------------------------------------------------------
      # 4. 成果物を artifact としてアップロード
      # --------------------------------------------------------
      - name: Upload scraping artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraping-${{ matrix.name }}
          path: ${{ matrix.output }}
          retention-days: 1
